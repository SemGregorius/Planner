<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>플래너</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#2a2925; --soft:#6d6a62; --faint:#a9a59b; --line:#e6e1d6;
  --accent:#34558b; --accent-bg:#e7edf7; --gold:#b07d2b; --gold-bg:#f6ecd9; --good:#3f7d58; --good-bg:#e3f0e7;
  --warn:#a65b2a; --chip:#efebe2; --shadow:0 1px 2px rgba(40,35,20,.06),0 4px 14px rgba(40,35,20,.05);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1c1b19; --panel:#262522; --ink:#ece8df; --soft:#b3aea3; --faint:#7c786f; --line:#3a3833;
  --accent:#8fb0e6; --accent-bg:#2b3546; --gold:#e0b46a; --gold-bg:#3d3424; --good:#86c79e; --good-bg:#263a2d;
  --warn:#e09a6a; --chip:#33312d; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font-size:16px}
.app{display:flex;min-height:100vh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
nav.side{width:92px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:calc(18px + env(safe-area-inset-top)) 0 18px;border-right:1px solid var(--line);background:var(--panel)}
nav.side .logo{font-size:26px;margin-bottom:14px}
nav.side button{width:76px;padding:10px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--soft)}
nav.side button .i{font-size:22px;line-height:1}
nav.side button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
nav.side .grow{flex:1}
main{flex:1;min-width:0;padding:calc(22px + env(safe-area-inset-top)) 28px calc(40px + env(safe-area-inset-bottom))}
@media (max-width:760px){
  .app{flex-direction:column}
  nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;width:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20}
  nav.side .logo,nav.side .grow{display:none}
  nav.side button{width:auto;flex:1;font-size:11px}
  main{padding:calc(16px + env(safe-area-inset-top)) 16px 100px}
}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .sub{font-size:13px;color:var(--faint);font-weight:400}
.date{color:var(--soft);margin-bottom:16px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.banner{border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner.morning{background:var(--gold-bg)}
.banner.info{background:var(--accent-bg)}
.banner .txt{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--chip);font-weight:500}
.btn.pri{background:var(--accent);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.muted{color:var(--soft)}
.faint{color:var(--faint);font-size:14px}
.small{font-size:14px}
.capture{display:flex;gap:8px}
.capture input{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0 16px;outline:none}
.capture input:focus{border-color:var(--accent)}
.now-card{display:flex;gap:14px;padding:16px;border-radius:14px;background:var(--gold-bg);margin-bottom:10px;align-items:flex-start}
.now-card:last-child{margin-bottom:0}
.now-card.first{outline:2px solid var(--gold)}
.check{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;margin-top:2px}
.check.on{background:var(--good);border-color:var(--good)}
.now-card .t{font-weight:600;font-size:17px}
.now-card .step{margin-top:4px;font-size:16px}
.now-card .step b{color:var(--gold)}
.now-card .if{margin-top:2px;color:var(--soft);font-size:14px}
.now-card .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-height:52px}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .title{overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:13px;color:var(--faint)}
.item.done .title{text-decoration:line-through;color:var(--faint)}
.tap{cursor:pointer}
.pchips{display:flex;gap:6px}
.pchip{width:40px;height:36px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px}
.pchip.A{color:#b0472f}.pchip.B{color:#9a7a1c}.pchip.C{color:var(--soft)}
.pchip.on{background:var(--ink);color:var(--panel)}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--chip);font-size:12.5px;color:var(--soft);white-space:nowrap}
.tag.A{background:#f6e1db;color:#a3402a}.tag.B{background:#f3ead0;color:#86691a}.tag.C{background:var(--chip)}
@media (prefers-color-scheme: dark){.tag.A{background:#4a2b25;color:#f0a593}.tag.B{background:#433a22;color:#e6c96e}}
.tag.cur{background:var(--accent);color:#fff;font-weight:700}
.tag.next{background:var(--accent-bg);color:var(--accent)}
.empty{color:var(--faint);padding:14px 2px;font-size:15px}
.routine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--chip);text-align:left;min-height:56px}
.rbtn .e{font-size:22px}
.rbtn .n{font-size:14.5px;line-height:1.3}
.rbtn.on{background:var(--good-bg);color:var(--good);font-weight:600}
.slot{font-size:12px;color:var(--faint);margin:8px 0 6px;letter-spacing:.04em}
.slot:first-child{margin-top:0}
.prog{display:flex;align-items:center;gap:16px}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--good);border-radius:6px}
.timer{display:flex;align-items:center;gap:16px}
.timer .clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:14.5px;min-height:38px}
.seg button.on{background:var(--ink);color:var(--panel);font-weight:600}
.seg .n{opacity:.6;margin-left:4px;font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.pcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pcard .t{font-weight:600;font-size:16.5px}
.pcard ol{margin:8px 0 0;padding-left:20px;font-size:14.5px;color:var(--soft)}
.focusbox ol{margin:6px 0 0;padding-left:20px}
.focusbox li{margin:2px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:12px;color:var(--faint);padding:4px 0}
.cal button{aspect-ratio:1.25;border-radius:10px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:2px}
.cal button.out{opacity:.35}
.cal button.today{outline:2px solid var(--accent)}
.cal button.sel{background:var(--accent);color:#fff}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.dentry{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.dentry:last-child{border-bottom:0}
.dentry .tm{width:86px;flex:none;font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px;padding-top:1px}
.dentry .t{font-weight:600}
.dentry .l{color:var(--soft);font-size:14.5px;margin-top:2px}
.mgroup{font-size:13px;color:var(--faint);margin:14px 0 4px;font-weight:600}
.mgroup:first-child{margin-top:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,18,12,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:761px){.scrim{align-items:center}}
.sheet{background:var(--panel);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 22px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:761px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 14px;font-size:19px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-size:13.5px;color:var(--soft);margin-bottom:6px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--faint);margin-top:4px}
.inp{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 14px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:90px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:999px;background:var(--chip);font-size:14.5px}
.chips input:checked+span{background:var(--ink);color:var(--panel);font-weight:600}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:14px;z-index:60;max-width:min(560px,92vw);font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:up .2s}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.rewards{grid-template-columns:1fr}}
.rewards .rw{background:var(--good-bg);border-radius:12px;padding:10px 12px;font-size:14px}
.rewards .rw b{display:block;font-size:12.5px;color:var(--good);margin-bottom:2px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
summary{cursor:pointer;color:var(--soft);font-size:14.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--faint)}
details[open] summary::before{content:"▾ "}
.chk{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.chk.on .box{background:var(--good);border-color:var(--good)}
.chk.on .txt{color:var(--faint)}
svg text{fill:var(--soft);font-size:11px}
.help h2{margin-top:22px}
.help p,.help li{color:var(--ink)}
.help ol,.help ul{padding-left:22px}
.kbd{display:inline-block;padding:0 6px;border-radius:6px;background:var(--chip);font-size:14px}
.redit{display:grid;grid-template-columns:44px 1fr 88px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.redit input,.redit select{min-height:42px}
@media (max-width:600px){.redit{grid-template-columns:44px 1fr 76px auto}}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--good)}.sw.on::after{left:23px}
.save-fail{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#fff;padding:8px 16px;text-align:center;z-index:70;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* ───────── 기본 데이터 ───────── */
const KEY = 'planner.v1';
const KDAY = ['일','월','화','수','목','금','토'];
const REASONS = [
  {k:'너무 큼', tip:'15분짜리로 다시 쪼개 보세요.'},
  {k:'무엇부터인지 모름', tip:'첫 2분 행동을 더 작게, 손이 움직이는 동사로 다시 적어 보세요.'},
  {k:'지루함', tip:'끝난 뒤의 보상을 미리 정하거나, 장소를 바꿔 보세요.'},
  {k:'잘 못할까 봐', tip:'제목 뒤에 「초안」을 붙이세요. 초안은 나빠도 됩니다.'},
  {k:'나중에 해도 될 듯', tip:'그 생각이 들면 → 첫 2분 행동만 지금 하기.'},
  {k:'시간 없음', tip:'예상 시간에 보정 배수를 곱해 다시 잡아 보세요.'}
];
const DEF_ROUTINES = [
  {id:'r1',name:'아침 5분 계획',emoji:'🌅',slot:'아침',active:true},
  {id:'r2',name:'아침 기도',emoji:'🙏',slot:'아침',active:true},
  {id:'r3',name:'집중 블록 1회',emoji:'📖',slot:'낮',active:true},
  {id:'r4',name:'저녁 2분 정리',emoji:'🌙',slot:'저녁',active:true},
  {id:'r5',name:'몸 움직이기 20분',emoji:'🚶',slot:'낮',active:false},
  {id:'r6',name:'저녁 성찰',emoji:'🕯️',slot:'저녁',active:false},
  {id:'r7',name:'취침 시각 지키기',emoji:'😴',slot:'저녁',active:false}
];
const REVIEW = [
  '인박스를 비운다: A·B·C로 매기거나 지운다',
  '다음 주 계획을 만들고 초점 세 가지를 적는다',
  '다음 주의 마감과 약속을 다이어리에 적는다',
  '진행 중인 목표·프로젝트마다 다음 할 일 하나를 내린다',
  '「미룬 이유」에서 가장 많았던 하나에 맞선 만약-그러면을 만든다',
  '시간 보정 배수를 보고 다음 주 예상 시간에 곱한다',
  '루틴 중 가장 자주 빠진 하나를 더 쉽게 바꾼다',
  '이번 주 잘 된 것 하나를 적는다',
  '백업을 내보낸다'
];
function defaults(){
  return {
    v:1, tasks:[], plans:[], diary:[],
    routines: DEF_ROUTINES.map(r=>({...r})), log:{},
    places:['집','학교','도서관','성당','카페','이동 중'],
    types:['일정','수업','만남','전례·기도','기록'],
    areas:['학업·논문','신앙','건강','관계','생활','배움'],
    rewards:{s:['차 한 잔','스트레칭','창밖 보기'], m:['산책 한 바퀴','좋아하는 노래 세 곡'], l:['맛있는 간식','읽고 싶던 책 한 장']},
    deferLog:[], review:{}, timer:null,
    settings:{block:25, lastMorning:'', lastBackup:'', started:ymd(new Date())}
  };
}
/* ───────── 날짜 ───────── */
const z2 = n => String(n).padStart(2,'0');
function ymd(d){return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())}
function pYmd(s){const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)}
function today(){return ymd(new Date())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dayDiff(a,b){return Math.round((pYmd(ymd(a))-pYmd(ymd(b)))/864e5)}
function fDate(s,withDay=true){if(!s)return '';const d=pYmd(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'+(withDay?' ('+KDAY[d.getDay()]+')':'')}
function fShort(s){if(!s)return '';const d=pYmd(s);return (d.getMonth()+1)+'/'+d.getDate()}
function fTime(dt){return dt&&dt.length>10?dt.slice(11,16):''}
function nowLocal(){const d=new Date();d.setMinutes(Math.round(d.getMinutes()/5)*5,0,0);return ymd(d)+'T'+z2(d.getHours())+':'+z2(d.getMinutes())}
function weekKey(d=new Date()){return ymd(monday(d))}
/* ───────── 저장 ───────── */
let saveFailed=false;
function load(){
  let d=null; try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const b=defaults();
  if(!d){seedPlans(b);return b}
  const s=Object.assign(b,d);
  s.settings=Object.assign(defaults().settings,d.settings||{});
  s.rewards=Object.assign(defaults().rewards,d.rewards||{});
  return s;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}
  catch(e){saveFailed=true}
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ───────── 계획 ───────── */
const KIND={week:'주간',month:'월간',year:'연간',goal:'목표',project:'프로젝트'};
function snap(kind,ref){
  const d=pYmd(ref);
  if(kind==='week'){const m=monday(d);return {start:ymd(m),end:ymd(addDays(m,6)),title:(m.getMonth()+1)+'/'+m.getDate()+' 주'}}

      const nx=S.tasks.find(t=>t.goalId===p.id&&!t.done); html+=`<div class="faint" style="margin-top:6px">다음 → ${nx?h(nx.title):'<span style="color:var(--warn)">다음 할 일이 없습니다</span>'}</div>`;
    } else if(f.length) html+=`<ol>${f.map(x=>`<li>${h(x)}</li>`).join('')}</ol>`;
    else html+=`<div class="faint" style="margin-top:8px">초점 세 가지를 적어 주세요 ›</div>`;
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

function diaryRow(e){

  return `<div class="dentry" data-act="edit-diary" data-id="${e.id}"><div class="tm">${s?s+(en?'–'+en:''):'하루'}</div><div style="flex:1;min-width:0"><div class="t">${e.mood?e.mood.split(' ')[0]+' ':''}${h(e.title||'(제목 없음)')}</div>
  <div class="row wrap" style="gap:6px;margin-top:3px">${e.place?`<span class="tag">📍 ${h(e.place)}</span>`:''}${e.type?`<span class="tag">${h(e.type)}</span>`:''}${e.people?`<span class="tag">👥 ${h(e.people)}</span>`:''}</div>
  ${e.line?`<div class="l">${h(e.line)}</div>`:''}</div></div>`;
}
function vDiary(){
  const F={today:'오늘',week:'최근 7일',cal:'달력',all:'월별 전체'};
  const t=today();
  let html=`<h1>다이어리</h1><div class="date">일정과 하루의 기록을 한 곳에. 날짜·시간·장소만 고르면 됩니다.</div>`;
  html+=`<div class="toolbar"><button class="btn pri" data-act="new-diary">✍️ 새로 적기</button><button class="btn" data-act="new-diary" data-type="일정">＋ 일정</button><button class="btn" data-act="new-diary" data-type="기록">＋ 오늘의 한 줄</button></div>`;
  html+=`<div class="seg">${Object.entries(F).map(([k,n])=>`<button class="${ui.diaryFilter===k?'on':''}" data-act="df" data-k="${k}">${n}</button>`).join('')}</div>`;
  const sorted=S.diary.slice().sort((a,b)=>(b.start||'')<(a.start||'')?-1:1);
  if(ui.diaryFilter==='today'){
    const l=sorted.filter(e=>(e.start||'').slice(0,10)===t).reverse();
    html+=`<div class="card">${l.length?l.map(diaryRow).join(''):'<div class="empty">오늘의 기록이 아직 없습니다.</div>'}</div>`;
  } else if(ui.diaryFilter==='week'){
    const from=ymd(addDays(new Date(),-6));
    const l=sorted.filter(e=>(e.start||'').slice(0,10)>=from&&(e.start||'').slice(0,10)<=t);
    html+=`<div class="card">${groupBy(l,e=>fDate(e.start))}</div>`;
  } else if(ui.diaryFilter==='cal'){
    const base=ui.calMonth?pYmd(ui.calMonth):new Date(); const y=base.getFullYear(),m=base.getMonth();
    const first=new Date(y,m,1),start=addDays(first,-first.getDay());
    const sel=ui.calDay||t;
    html+=`<div class="grid"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn sm ghost" data-act="cal" data-d="-1">‹</button><b>${y}년 ${m+1}월</b><button class="btn sm ghost" data-act="cal" data-d="1">›</button></div><div class="cal">${KDAY.map(k=>`<div class="dh">${k}</div>`).join('')}`;
    for(let i=0;i<42;i++){const d=addDays(start,i),k=ymd(d),n=S.diary.filter(e=>(e.start||'').slice(0,10)===k).length;
      html+=`<button class="${d.getMonth()!==m?'out':''} ${k===t?'today':''} ${k===sel?'sel':''}" data-act="calday" data-k="${k}">${d.getDate()}<span class="dots">${'<i></i>'.repeat(Math.min(n,3))}</span></button>`}
    html+=`</div></div><div class="card"><h2>${fDate(sel)}</h2>`;
    const l=S.diary.filter(e=>(e.start||'').slice(0,10)===sel).sort((a,b)=>a.start<b.start?-1:1);
    html+=l.length?l.map(diaryRow).join(''):'<div class="empty">이날의 기록이 없습니다.</div>';
    html+=`<button class="btn sm" style="margin-top:10px" data-act="new-diary" data-day="${sel}">＋ 이날에 적기</button></div></div>`;
  } else {
    html+=`<div class="card">${groupBy(sorted,e=>{const d=pYmd(e.start||today());return d.getFullYear()+'년 '+(d.getMonth()+1)+'월'})}</div>`;
  }
  return html;
}
function groupBy(list,fn){
  if(!list.length)return '<div class="empty">기록이 없습니다.</div>';
  let out='',last=null;
  list.forEach(e=>{const g=fn(e);if(g!==last){out+=`<div class="mgroup">${h(g)}</div>`;last=g}out+=diaryRow(e)});
  return out;
}

function vReview(){

  S.deferLog.filter(x=>x.at>=since).forEach(x=>cnt[x.reason]=(cnt[x.reason]||0)+1);
  const mx=Math.max(1,...Object.values(cnt)),top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  html+=`<section class="card"><h2>⏸️ 미룬 이유 <span class="sub">최근 4주</span></h2>`;
  Object.entries(cnt).forEach(([k,v])=>{html+=`<div class="row" style="margin-bottom:8px"><span style="width:140px;font-size:14px">${h(k)}</span><div class="bar"><i style="width:${v/mx*100}%;background:var(--gold)"></i></div><span class="faint" style="width:24px;text-align:right">${v}</span></div>`});
  if(top&&top[1]>0){const tip=REASONS.find(r=>r.k===top[0]);html+=`<div class="banner info small" style="margin-top:10px"><span>가장 많은 이유는 <b>${h(top[0])}</b>. ${h(tip?tip.tip:'')}</span></div>`}
  html+=`</section></div><div class="col">`;
  // 루틴 14일
  const days=[...Array(14)].map((_,i)=>ymd(addDays(new Date(),i-13)));
  const W=420,H=150,bw=W/14;
  html+=`<section class="card"><h2>🔁 루틴 흐름 <span class="sub">최근 14일</span></h2><svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto">`;
  [0,.5,1].forEach(g=>html+=`<line x1="0" x2="${W}" y1="${H-g*H+.5}" y2="${H-g*H+.5}" stroke="var(--line)"/>`);
  days.forEach((d,i)=>{const p=routinePct(d),bh=Math.max(p*H,p>0?3:0);html+=`<rect x="${i*bw+4}" y="${H-bh}" width="${bw-8}" height="${bh}" rx="4" fill="${d===today()?'var(--accent)':'var(--good)'}"/><text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle">${pYmd(d).getDate()}</text>`});
  html+=`</svg>`;
  const act=S.routines.filter(r=>r.active);
  html+=`<div style="margin-top:10px">${act.map(r=>{const n=days.filter(d=>(S.log[d]||{})[r.id]).length;return `<div class="row" style="margin-bottom:6px"><span style="width:150px;font-size:14px">${r.emoji} ${h(r.name)}</span><div class="bar"><i style="width:${n/14*100}%"></i></div><span class="faint" style="width:40px;text-align:right">${n}/14</span></div>`}).join('')}</div></section>`;
  // 시간 보정
  const rs=S.tasks.filter(t=>t.done&&t.est>0&&t.actual>0).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,20);
  html+=`<section class="card"><h2>⏱️ 시간 보정 <span class="sub">예상과 실제를 모두 적은 최근 일</span></h2>`;
  if(rs.length<3) html+=`<div class="empty">예상·실제를 모두 적은 일이 ${rs.length}개입니다. 세 개가 넘으면 나의 시간 환산표가 나옵니다.</div>`;
  else {const avg=rs.reduce((s,t)=>s+t.actual/t.est,0)/rs.length;html+=`<div style="font-size:30px;font-weight:700">${avg.toFixed(1)}배</div><div class="muted">「30분이면 될 것 같다」는 일은 <b>${Math.round(30*avg)}분</b>, 「1시간」은 <b>${Math.round(60*avg)}분</b>으로 잡으세요.</div>`}
  html+=`</section>`;
  // 주간 완료
  const weeks=[...Array(6)].map((_,i)=>monday(addDays(new Date(),-7*(5-i))));
  const wc=weeks.map(m=>S.tasks.filter(t=>t.done&&t.doneAt&&monday(new Date(t.doneAt)).getTime()===m.getTime()).length);
  const wm=Math.max(1,...wc);
  html+=`<section class="card"><h2>✅ 끝낸 일 <span class="sub">주별</span></h2>${weeks.map((m,i)=>`<div class="row" style="margin-bottom:6px"><span style="width:80px" class="faint">${fShort(ymd(m))} 주</span><div class="bar"><i style="width:${wc[i]/wm*100}%;background:var(--accent)"></i></div><span class="faint" style="width:28px;text-align:right">${wc[i]}</span></div>`).join('')}</section>`;
  html+=`</div></div>`;
  return html;
}

function openPlan(kind,off){
  if(kind==='goal'||kind==='project'){const p=makePlan(kind,today());p.title='';openSheet('plan',p);return}
  const t=new Date();let ref;
  if(kind==='week')ref=addDays(t,7*off);else if(kind==='month')ref=new Date(t.getFullYear(),t.getMonth()+off,1);else ref=new Date(t.getFullYear()+off,0,1);

  const p=makePlan(kind,ymd(ref));openSheet('plan',p);
}

  'rt-toggle'(d){const r=S.routines.find(x=>x.id===d.id);r.active=!r.active;commit()},
  'rt-del'(d){
    if(!d.ok){openSheet('confirm',{title:'이 루틴을 지울까요?',msg:'지난 기록은 남지만 화면에서 사라집니다. 잠시 쉬게 하려면 지우지 말고 끄기만 하세요.',ok:'지우기',act:'rt-del',id:d.id,danger:true});return}
    S.routines=S.routines.filter(x=>x.id!==d.id);closeSheet();commit();
  },
  'rt-add'(){S.routines.push({id:'r'+uid(),name:'새 루틴',emoji:'✨',slot:'아침',active:true});commit()},
  export(){
    const name=`플래너-백업-${today()}.json`,txt=JSON.stringify(S);
    const blob=new Blob([txt],{type:'application/json'});
    S.settings.lastBackup=today();save();
    try{const file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(()=>toast('백업을 내보냈습니다. 「파일에 저장」을 고르세요.')).catch(()=>{});render();return}}catch(e){}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('백업 파일을 저장했습니다.');render()}
    catch(e){openSheet('text',{})}
  },
  'export-text'(){openSheet('text',{})},
  'copy-text'(){const t=document.getElementById('bk-text');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('복사했습니다.'))}catch(e){document.execCommand('copy');toast('복사했습니다.')}},
  'import-text'(){const t=document.getElementById('bk-text').value;importJSON(t)},
  import(){document.getElementById('importFile').click()},
  reset(d){
    if(!d.ok){openSheet('confirm',{title:'모두 지울까요?',msg:'할 일, 계획, 다이어리, 루틴 기록이 모두 사라집니다. 되돌릴 수 없습니다.',ok:'모두 지우기',act:'reset',danger:true});return}
    const b=defaults();seedPlans(b);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,b);closeSheet();commit();toast('처음 상태로 돌아갔습니다.');
  }
};
function importJSON(txt){
  let d;try{d=JSON.parse(txt)}catch(e){toast('백업 파일을 읽지 못했습니다.');return}
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.plans)){toast('플래너 백업 파일이 아닙니다.');return}
  const b=defaults();Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,b,d);S.settings=Object.assign(b.settings,d.settings||{});
  closeSheet();commit();toast('백업을 불러왔습니다.');
}
/* ───────── 이벤트 ───────── */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='scrim'){if(e.target===el)closeSheet();return}
  const fn=A[el.dataset.act];if(!fn)return;
  e.preventDefault();fn({...el.dataset},el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target;const kind=f.dataset.form;if(!kind)return;e.preventDefault();
  const fd=new FormData(f),g=k=>(fd.get(k)||'').toString().trim();
  if(kind==='capture'){const t=g('title');if(!t)return;
    if(ui.view==='tasks'&&['A','B','C'].includes(ui.taskFilter))newTask(t,{priority:ui.taskFilter});else newTask(t);
    save();render();const inp=document.querySelector('.capture input');if(inp)inp.focus();toast('인박스에 적었습니다.',1600);return}
  if(kind==='task'){
    let t=findT(f.dataset.id);const isNew=!t;if(isNew)t=newTask('');
    Object.assign(t,{title:g('title')||t.title||'(제목 없음)',priority:['A','B','C'].includes(g('priority'))?g('priority'):null,firstStep:g('firstStep'),ifThen:g('ifThen'),est:Number(g('est'))||0,actual:Number(g('actual'))||0,date:g('date'),goalId:g('goalId'),note:g('note')});
    const td=fd.get('today')==='on';if(td&&!t.today){t.today=true;t.pickedAt=today()}else if(!td)t.today=false;
    closeSheet();commit();return}
  if(kind==='plan'){
    let p=findP(f.dataset.id);const isNew=!p;if(isNew){p=ui.sheet.obj;S.plans.push(p)}
    const isG=p.kind==='goal'||p.kind==='project';
    p.title=g('title');p.notes=g('notes');
    if(isG){Object.assign(p,{start:g('start'),end:g('end'),area:g('area'),status:g('status')||'active',why:g('why'),doneLook:g('doneLook')});
      if(!p.title)p.title=p.kind==='project'?'새 프로젝트':'새 목표';
      const nt=g('nextTask');if(nt)newTask(nt,{priority:'A',goalId:p.id});}
    else{const sn=snap(p.kind,g('start')||p.start);const auto=[snap(p.kind,p.start).title];p.start=sn.start;p.end=sn.end;if(!p.title||auto.includes(p.title))p.title=sn.title;
      p.focus=[0,1,2].map(i=>g('focus'+i));p.review=g('review');
      if(p.kind==='week'){p.days={};['월','화','수','목','금','토','일'].forEach(k=>p.days[k]=g('day_'+k))}
      if(p.kind==='month'){p.monthly=g('monthly');p.expenses=g('expenses')}
      if(p.kind==='year'){p.goalsText=g('goalsText');p.months={};for(let i=1;i<=12;i++)p.months[i]=g('mon_'+i)}}
    closeSheet();commit();toast('저장했습니다.',1400);return}
  if(kind==='diary'){
    let e2=findD(f.dataset.id);const isNew=!e2;if(isNew){e2={...ui.sheet.obj,createdAt:Date.now()};S.diary.push(e2)}
    let place=g('place');const pn=g('placeNew');if(pn){place=pn;if(!S.places.includes(pn))S.places.push(pn)}
    Object.assign(e2,{title:g('title')||'(제목 없음)',start:g('start')||nowLocal(),end:g('end'),place,type:g('type'),people:g('people'),line:g('line'),good:g('good'),mood:g('mood'),energy:g('energy'),goalId:g('goalId'),body:g('body')});
    closeSheet();commit();toast('적었습니다.',1400);return}
  if(kind==='done'){const t=findT(f.dataset.id);const a=Number(g('actual'));if(a)t.actual=a;const rw=g('rw');closeSheet();commit();toast(rw?'보상: '+rw+' — 잘 하셨습니다.':'잘 하셨습니다.');return}
  if(kind==='defer'){const t=findT(f.dataset.id);const r=g('reason');if(!r)return;S.deferLog.push({taskId:t.id,reason:r,at:Date.now()});t.reasons=[...(t.reasons||[]),r];if(fd.get('drop')==='on')t.today=false;
    const tip=REASONS.find(x=>x.k===r);closeSheet();commit();toast('기록했습니다. '+(tip?tip.tip:''),5200);return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.closest('form[data-form=defer]')&&el.name==='reason'){const tip=REASONS.find(x=>x.k===el.value),b=document.getElementById('defer-tip');b.style.display='flex';b.textContent='다음엔 이렇게: '+tip.tip;return}
  if(el.dataset.rt){const r=S.routines.find(x=>x.id===el.dataset.rt);r[el.dataset.f]=el.value.trim()||r[el.dataset.f];save();return}
  if(el.dataset.set==='block'){S.settings.block=Math.max(5,Math.min(120,Number(el.value)||25));save();toast('블록 길이를 바꿨습니다.',1400);return}
  if(el.dataset.rw){S.rewards[el.dataset.rw]=el.value.split(',').map(s=>s.trim()).filter(Boolean);save();return}
  if(el.dataset.ls){const v=el.value.split(',').map(s=>s.trim()).filter(Boolean);if(v.length)S[el.dataset.ls]=v;save();return}
  if(el.id==='importFile'&&el.files[0]){const r=new FileReader();r.onload=()=>importJSON(r.result);r.readAsText(el.files[0]);el.value=''}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
/* ───────── 시작 ───────── */
render();
if(S.timer)startTick();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
